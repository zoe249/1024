<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111a22">
  <meta name="color-scheme" content="dark">
  <title>1024 · 水球合成</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overscroll-behavior: none; }
    body { background: #080d14; color: #e6f3ef; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    button { font: inherit; cursor: pointer; }
    .game { width: 100%; max-width: 440px; height: 100dvh; min-height: 480px; margin: auto; padding: max(14px, env(safe-area-inset-top)) 18px max(12px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; background: #111a22; overflow: hidden; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { font-size: 23px; letter-spacing: -1px; margin: 0; line-height: 1.2; }
    h1 span { font-size: 13px; font-weight: 500; letter-spacing: 1px; margin-left: 8px; }
    .score { margin-top: 5px; font-size: 12px; color: #96aea8; }
    .score strong { color: #82dcc5; font-size: 16px; font-variant-numeric: tabular-nums; margin-left: 4px; }
    #restart { border: 1px solid #334951; border-radius: 12px; background: #1b2c35; color: #bbd3ce; padding: 9px 12px; font-size: 12px; }
    button:focus-visible { outline: 3px solid #6cdbc0; outline-offset: 3px; }
    .queue { background: #18252e; border: 1px solid #2b3c45; border-radius: 20px; padding: 10px 12px 9px; }
    .queue-heading { display: flex; justify-content: space-between; font-size: 10px; color: #91aaa3; letter-spacing: 1px; }
    .queue-heading b { color: #b9d4cb; font-weight: 500; }
    .queue-track { display: flex; align-items: center; height: 63px; overflow: hidden; }
    .slot { display: grid; place-items: center; width: 20%; flex-shrink: 0; height: 61px; position: relative; }
    .slot:first-child::after { content: ""; position: absolute; bottom: 0; width: 15px; height: 3px; border-radius: 2px; background: #78d0b6; }
    .bubble { display: grid; place-items: center; border-radius: 47% 53% 49% 51%; color: #234d49; font-weight: 800; font-variant-numeric: tabular-nums; background: var(--color); box-shadow: 0 3px 6px #00000040; border: 1px solid #0000001a; }
    .field { flex: 1; min-height: 200px; position: relative; border-radius: 24px; overflow: hidden; background: linear-gradient(#101d26, #14292b); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
    .result { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; padding: 24px; background: #101a24ed; backdrop-filter: blur(7px); text-align: center; }
    .result[hidden] { display: none; }
    .result h2 { margin: 0; font-size: 27px; }
    .result p { font-size: 13px; margin: 0; color: #a4bab1; }
    #again { border: 0; border-radius: 14px; color: #09241d; background: #65bda5; padding: 12px 27px; }
    footer { flex-shrink: 0; }
    .power-caption { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #a0b8ae; margin-bottom: 7px; }
    #powerText { font-variant-numeric: tabular-nums; color: #89d7bf; }
    .power-track { height: 6px; background: #2b403f; border-radius: 5px; overflow: hidden; }
    #powerFill { height: 100%; width: 0; background: linear-gradient(90deg, #70cdb0, #e5bf59); border-radius: inherit; }
    .hint { margin: 10px 0 7px; text-align: center; color: #adc6bd; font-size: 12px; }
    .rule { text-align: center; color: #879f96; font-size: 10px; margin: 0; }
    @media (min-width: 600px) {
      body { display: grid; place-items: center; }
      .game { height: calc(100dvh - 36px); max-height: 900px; border-radius: 30px; box-shadow: 0 20px 80px #00000055; }
    }
    @media (max-height: 600px) {
      .game { gap: 7px; padding-top: 8px; padding-bottom: 8px; }
      h1 { font-size: 20px; }
      .queue { padding-top: 7px; padding-bottom: 4px; }
      .queue-track { height: 54px; }
      .slot { height: 53px; }
      .hint { margin: 7px 0 4px; }
    }
    @media (prefers-reduced-motion: reduce) { .slot { animation: none !important; } }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div><h1>1024<span>水球合成</span></h1><div class="score">合成得分 <strong id="score">0</strong></div></div>
      <button id="restart" type="button" aria-label="重新开始游戏">重新开始</button>
    </header>
    <section class="queue" aria-label="接下来的五颗水球">
      <div class="queue-heading"><b>待发水球</b><span>从左到右 · 依次发射</span></div>
      <div class="queue-track" id="queue"></div>
    </section>
    <section class="field" id="field">
      <canvas id="canvas" aria-label="水球容器，按住蓄力，拖动瞄准，松手发射"></canvas>
      <div class="result" id="result" hidden>
        <h2 id="resultTitle"></h2><p id="resultText"></p><button id="again" type="button">再来一局</button>
      </div>
    </section>
    <footer>
      <div class="power-caption"><span>发射力度</span><span id="powerText">等待蓄力</span></div>
      <div class="power-track"><div id="powerFill"></div></div>
      <p class="hint">按住蓄力 · 拖动瞄准 · 松手发射</p>
      <p class="rule">同值相碰即合成 · 数字越大，水球越大 · 目标 1024</p>
    </footer>
  </main>
  <script>
    'use strict';
    (() => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const queueElement = document.getElementById('queue');
      const scoreElement = document.getElementById('score');
      const powerFill = document.getElementById('powerFill');
      const powerText = document.getElementById('powerText');
      const result = document.getElementById('result');
      const W = 390, LEFT = 20, RIGHT = 370, N = 32, STEP = 1 / 120;
      const GRAVITY = 920, CHARGE_SECONDS = 1.5;
      const TAU = Math.PI * 2;
      const SPAWN_VALUES = [2, 4, 8, 8, 16, 16, 16, 32, 32, 64];
      // 使用鲜明宝石色，并按球身明度搭配字色，保证数字在暗色容器内清晰可读。
      const COLORS = [
        ['#149b83', '#071018'], ['#1679bc', '#ffffff'],
        ['#6356db', '#ffffff'], ['#b23c91', '#ffffff'],
        ['#dd6847', '#071018'], ['#d8a638', '#071018'],
        ['#699d48', '#071018'], ['#139cba', '#071018'],
        ['#9e4acd', '#ffffff'], ['#e9ba50', '#071018']
      ];
      let H = 500, balls = [], effects = [], queue = [], score = 0, nextId = 1;
      let aiming = false, pointerId = null, aimAngle = 0, chargeStart = 0;
      let ended = false, overflow = 0, elapsed = 0, lastShot = -10, shots = 0;
      let lastFrame = 0, accumulator = 0;
      const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
      const radius = value => Math.min(40, 16 + (Math.log2(value) - 1) * 2.65);
      const palette = value => COLORS[Math.min(9, Math.log2(value) - 1)];
      const bottom = () => H - 21;
      const dangerY = () => Math.min(133, H * 0.31);
      const origin = () => ({ x: W / 2, y: 57 });
      const charge = () => aiming ? clamp((performance.now() - chargeStart) / 1000 / CHARGE_SECONDS, 0, 1) : 0;
      const shotSpeed = power => 230 + 820 * power;

      function randomValue() {
        return SPAWN_VALUES[Math.floor(Math.random() * SPAWN_VALUES.length)];
      }

      function renderQueue(animate) {
        queueElement.replaceChildren();
        queue.forEach(value => {
          const slot = document.createElement('div');
          const bubble = document.createElement('div');
          const colors = palette(value);
          const size = radius(value) * 1.08;
          slot.className = 'slot';
          bubble.className = 'bubble';
          bubble.textContent = value;
          bubble.style.cssText = `width:${size}px;height:${size}px;font-size:${Math.max(10, Math.min(15, size * 0.44))}px;--color:${colors[0]};color:${colors[1]}`;
          slot.append(bubble);
          queueElement.append(slot);
          if (animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            slot.animate([{ transform: 'translateX(62px)', opacity: 0.4 }, { transform: 'translateX(0)', opacity: 1 }], { duration: 210, easing: 'ease-out' });
          }
        });
      }

      function makeBall(value, x, y, vx = 0, vy = 0) {
        const r = radius(value);
        return { id: nextId++, value, x, y, vx, vy, r, mass: r * r, age: 0,
          dead: false, impactTimer: 0, contacts: [], offset: new Float32Array(N), wave: new Float32Array(N) };
      }

      function reset() {
        cancelAim();
        balls = [];
        effects = [];
        queue = Array.from({ length: 5 }, randomValue);
        score = 0;
        elapsed = 0;
        lastShot = -10;
        shots = 0;
        ended = false;
        overflow = 0;
        accumulator = 0;
        aimAngle = 0;
        result.hidden = true;
        scoreElement.textContent = '0';
        renderQueue(false);
      }

      function finish(won) {
        ended = true;
        cancelAim();
        document.getElementById('resultTitle').textContent = won ? '合成 1024！' : '容器装满了';
        document.getElementById('resultText').textContent = `本局得分 ${score} · 已发射 ${shots} 颗水球`;
        result.hidden = false;
      }

      function resize() {
        cancelAim();
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const previous = H;
        H = rect.height * W / rect.width;
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        for (const ball of balls) ball.y = clamp(ball.y + H - previous, 20 + ball.r, bottom() - ball.r * 0.86);
        accumulator = 0;
      }

      function updateAim(event) {
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) * W / rect.width;
        const y = (event.clientY - rect.top) * H / rect.height;
        const start = origin();
        aimAngle = clamp(Math.atan2(x - start.x, Math.max(70, y - start.y)), -1.08, 1.08);
      }

      function cancelAim() {
        aiming = false;
        if (pointerId !== null && canvas.hasPointerCapture(pointerId)) canvas.releasePointerCapture(pointerId);
        pointerId = null;
        powerFill.style.width = '0%';
        powerText.textContent = '等待蓄力';
      }

      canvas.addEventListener('pointerdown', event => {
        if (ended || aiming || elapsed - lastShot < 0.28 || (event.pointerType === 'mouse' && event.button !== 0)) return;
        event.preventDefault();
        aiming = true;
        pointerId = event.pointerId;
        chargeStart = performance.now();
        updateAim(event);
        canvas.setPointerCapture(pointerId);
      });
      canvas.addEventListener('pointermove', event => {
        if (aiming && event.pointerId === pointerId) updateAim(event);
      });
      canvas.addEventListener('pointerup', event => {
        if (!aiming || event.pointerId !== pointerId) return;
        updateAim(event);
        const power = charge();
        const start = origin();
        const speed = shotSpeed(power);
        balls.push(makeBall(queue.shift(), start.x, start.y, Math.sin(aimAngle) * speed, Math.cos(aimAngle) * speed));
        queue.push(randomValue());
        lastShot = elapsed;
        shots++;
        cancelAim();
        renderQueue(true);
      });
      canvas.addEventListener('pointercancel', event => { if (event.pointerId === pointerId) cancelAim(); });
      canvas.addEventListener('lostpointercapture', event => { if (event.pointerId === pointerId) cancelAim(); });
      canvas.addEventListener('contextmenu', event => event.preventDefault());
      window.addEventListener('blur', cancelAim);
      document.addEventListener('visibilitychange', () => { cancelAim(); accumulator = 0; lastFrame = 0; });
      document.getElementById('restart').addEventListener('click', reset);
      document.getElementById('again').addEventListener('click', reset);

      // 冲击沿表面传播；位置纠正不计入速度，避免静止球堆持续增能。
      function impact(ball, nx, ny, strength) {
        // 同一次接触持续数帧，只激发一次主振动，避免弹簧反复注入能量。
        if (ball.impactTimer > 0 || strength < 80) return;
        ball.impactTimer = 0.09;
        const amplitude = Math.min(ball.r * 12, strength * 0.78);
        for (let k = 0; k < N; k++) {
          const angle = k * TAU / N;
          const d = Math.cos(angle) * nx + Math.sin(angle) * ny;
          // 撞击轴收缩、垂直方向鼓起，随后越过原形再回摆。
          ball.wave[k] += amplitude * (-0.78 * (2 * d * d - 1) - 0.22 * Math.pow(Math.max(0, d), 8));
        }
      }

      /** 墙面先压缩水球，再由接触弹簧推回；深度限位只处理极端挤压。 */
      function walls(ball, collect, respond = false) {
        const boundaries = [
          { nx: -1, ny: 0, d: ball.x - LEFT }, { nx: 1, ny: 0, d: RIGHT - ball.x },
          { nx: 0, ny: -1, d: ball.y - 10 }, { nx: 0, ny: 1, d: bottom() - ball.y }
        ];
        for (const wall of boundaries) {
          const speed = ball.vx * wall.nx + ball.vy * wall.ny;
          const compression = ball.r * 0.9 - wall.d;
          if (respond && compression > 0) {
            impact(ball, wall.nx, wall.ny, speed);
            const damping = Math.abs(speed) > 70 ? 12 : 30;
            const impulse = Math.max(0, compression * 1800 + speed * damping) * STEP;
            ball.vx -= wall.nx * impulse;
            ball.vy -= wall.ny * impulse;
            const tangent = -wall.ny * ball.vx + wall.nx * ball.vy;
            const friction = clamp(tangent, -impulse * 0.12, impulse * 0.12);
            ball.vx += wall.ny * friction;
            ball.vy -= wall.nx * friction;
          }
          if (wall.d < ball.r * 0.56) {
            const correction = ball.r * 0.56 - wall.d;
            ball.x -= wall.nx * correction;
            ball.y -= wall.ny * correction;
            const remaining = ball.vx * wall.nx + ball.vy * wall.ny;
            if (remaining > 0) {
              ball.vx -= wall.nx * remaining * 1.16;
              ball.vy -= wall.ny * remaining * 1.16;
            }
          }
        }
        if (collect) {
          if (ball.x - LEFT < ball.r + 1) ball.contacts.push({ nx: -1, ny: 0, d: ball.x - LEFT });
          if (RIGHT - ball.x < ball.r + 1) ball.contacts.push({ nx: 1, ny: 0, d: RIGHT - ball.x });
          if (ball.y - 10 < ball.r + 1) ball.contacts.push({ nx: 0, ny: -1, d: ball.y - 10 });
          if (bottom() - ball.y < ball.r + 1) ball.contacts.push({ nx: 0, ny: 1, d: bottom() - ball.y });
        }
      }

      function merge(a, b, pending) {
        a.dead = b.dead = true;
        const value = a.value * 2;
        const merged = makeBall(value, (a.x + b.x) / 2, (a.y + b.y) / 2,
          (a.vx + b.vx) * 0.32, (a.vy + b.vy) * 0.32 - 28);
        pending.push(merged);
        for (let k = 0; k < N; k++) merged.wave[k] = Math.cos(k * 2 * TAU / N) * merged.r * 6;
        const color = palette(value)[0];
        effects.push({ type: 'ring', x: merged.x, y: merged.y, r: merged.r, age: 0, life: 0.45, color, value });
        for (let k = 0; k < 9; k++) {
          const angle = k * TAU / 9;
          const speed = 55 + Math.random() * 100;
          effects.push({ type: 'drop', x: merged.x, y: merged.y, vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 65, age: 0, life: 0.5 + Math.random() * 0.2, color });
        }
        score += value;
        scoreElement.textContent = score;
      }

      /** 用接触面压扁局部轮廓，再以有限的体积补偿和阻尼弹簧恢复形状。 */
      function deform(ball, dt) {
        const targets = new Float32Array(N);
        const speed = Math.hypot(ball.vx, ball.vy);
        const direction = Math.atan2(ball.vy, ball.vx);
        const stretch = Math.min(0.21, speed * 0.00021);
        let squaredArea = 0;
        for (let k = 0; k < N; k++) {
          const angle = k * TAU / N;
          let r = ball.r * (1 + stretch * Math.cos(2 * (angle - direction)));
          for (const contact of ball.contacts) {
            const projection = Math.cos(angle) * contact.nx + Math.sin(angle) * contact.ny;
            if (projection > 0.01) r = Math.min(r, contact.d / projection);
          }
          targets[k] = r;
          squaredArea += r * r;
        }
        const compensation = clamp(Math.sqrt(N * ball.r * ball.r / Math.max(1, squaredArea)), 1, 1.25);
        for (let k = 0; k < N; k++) {
          const angle = k * TAU / N;
          let r = targets[k] * compensation;
          for (const contact of ball.contacts) {
            const projection = Math.cos(angle) * contact.nx + Math.sin(angle) * contact.ny;
            if (projection > 0.01) r = Math.min(r, contact.d / projection);
          }
          const target = clamp(r - ball.r, -ball.r * 0.46, ball.r * 0.4);
          const neighbors = ball.offset[(k + N - 1) % N] + ball.offset[(k + 1) % N] - 2 * ball.offset[k];
          // 环形节点相互牵引，让冲击传到球身另一侧，并保留可见的阻尼余颤。
          ball.wave[k] += ((target - ball.offset[k]) * 165 + neighbors * 160 - ball.wave[k] * 6.2) * dt;
        }
        for (let k = 0; k < N; k++) {
          const next = ball.offset[k] + ball.wave[k] * dt;
          ball.offset[k] = clamp(next, -ball.r * 0.46, ball.r * 0.5);
          if (next !== ball.offset[k] && Math.abs(next - ball.offset[k]) > 0.001) ball.wave[k] *= 0.4;
        }
      }

      /** 固定步长积分、顺序冲量与多次位置求解，合成统一在求解后入列。 */
      function physics(dt) {
        elapsed += dt;
        const pending = [];
        for (const ball of balls) {
          ball.age += dt;
          ball.impactTimer = Math.max(0, ball.impactTimer - dt);
          ball.contacts.length = 0;
          ball.vy = Math.min(1400, ball.vy + GRAVITY * dt);
          ball.vx *= Math.exp(-0.2 * dt);
          ball.x += ball.vx * dt;
          ball.y += ball.vy * dt;
          walls(ball, false, true);
        }
        for (let iteration = 0; iteration < 6; iteration++) {
          for (const ball of balls) if (!ball.dead) walls(ball, false);
          for (let i = 0; i < balls.length; i++) {
            const a = balls[i];
            if (a.dead) continue;
            for (let j = i + 1; j < balls.length; j++) {
              const b = balls[j];
              if (a.dead) break;
              if (b.dead) continue;
              const dx = b.x - a.x, dy = b.y - a.y, sum = a.r + b.r;
              if (Math.abs(dx) > sum || Math.abs(dy) > sum) continue;
              const distance = Math.hypot(dx, dy);
              if (distance > sum) continue;
              if (a.value === b.value) {
                merge(a, b, pending);
                break;
              }
              const nx = distance > 0.001 ? dx / distance : 1;
              const ny = distance > 0.001 ? dy / distance : 0;
              const inverseA = 1 / a.mass, inverseB = 1 / b.mass, inverseSum = inverseA + inverseB;
              const correction = Math.max(0, sum - distance - Math.min(a.r, b.r) * 0.6) * 0.75 / inverseSum;
              a.x -= nx * correction * inverseA; a.y -= ny * correction * inverseA;
              b.x += nx * correction * inverseB; b.y += ny * correction * inverseB;
              const relativeX = b.vx - a.vx, relativeY = b.vy - a.vy;
              const approach = relativeX * nx + relativeY * ny;
              if (iteration === 0) {
                const compression = Math.max(0, sum - distance - Math.min(a.r, b.r) * 0.12);
                const damping = Math.abs(approach) > 70 ? 12 : 28;
                const impulse = Math.max(0, compression * 1800 - approach * damping) * dt / inverseSum;
                a.vx -= impulse * nx * inverseA; a.vy -= impulse * ny * inverseA;
                b.vx += impulse * nx * inverseB; b.vy += impulse * ny * inverseB;
                const friction = clamp((relativeX * -ny + relativeY * nx) / inverseSum, -impulse * 0.12, impulse * 0.12);
                a.vx += -ny * friction * inverseA; a.vy += nx * friction * inverseA;
                b.vx -= -ny * friction * inverseB; b.vy -= nx * friction * inverseB;
                if (approach < -70) { impact(a, nx, ny, -approach); impact(b, -nx, -ny, -approach); }
              }
            }
          }
        }
        balls = balls.filter(ball => !ball.dead);
        balls.push(...pending);
        for (const ball of balls) walls(ball, true);
        // 只保留最终接触面，避免求解过程里的旧位置让形状产生错误凹陷。
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const a = balls[i], b = balls[j];
            const dx = b.x - a.x, dy = b.y - a.y, distance = Math.hypot(dx, dy);
            if (distance < 0.001 || distance > a.r + b.r + 1) continue;
            const nx = dx / distance, ny = dy / distance;
            a.contacts.push({ nx, ny, d: distance * a.r / (a.r + b.r) });
            b.contacts.push({ nx: -nx, ny: -ny, d: distance * b.r / (a.r + b.r) });
          }
        }
        for (const ball of balls) deform(ball, dt);
        const crowded = balls.some(ball => ball.age > 2 && ball.y - ball.r < dangerY() && Math.hypot(ball.vx, ball.vy) < 85);
        overflow = crowded ? overflow + dt : Math.max(0, overflow - dt * 2);
        if (pending.some(ball => ball.value >= 1024)) finish(true);
        else if (overflow > 2) finish(false);
      }

      function updateEffects(dt) {
        for (const effect of effects) {
          effect.age += dt;
          if (effect.type === 'drop') {
            effect.vy += 360 * dt;
            effect.x += effect.vx * dt;
            effect.y += effect.vy * dt;
          }
        }
        effects = effects.filter(effect => effect.age < effect.life);
      }

      function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, TAU); }

      function drawContainer(time) {
        const floor = bottom();
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#85b8ae22';
        ctx.beginPath();
        for (let x = 40; x < W; x += 26) {
          for (let y = 160; y < floor - 10; y += 26) { ctx.moveTo(x + 0.7, y); ctx.arc(x, y, 0.7, 0, TAU); }
        }
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(LEFT, dangerY() - 9); ctx.lineTo(LEFT, floor - 23);
        ctx.quadraticCurveTo(LEFT, floor, LEFT + 23, floor);
        ctx.lineTo(RIGHT - 23, floor); ctx.quadraticCurveTo(RIGHT, floor, RIGHT, floor - 23);
        ctx.lineTo(RIGHT, dangerY() - 9);
        ctx.lineWidth = 5; ctx.strokeStyle = '#2c484b'; ctx.lineCap = 'round'; ctx.stroke();
        ctx.lineWidth = 1.5; ctx.strokeStyle = '#5c8284'; ctx.stroke();
        ctx.save();
        ctx.setLineDash([4, 7]);
        ctx.strokeStyle = overflow > 0.15 ? '#f3aa8f' : '#6d8c8a99';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(LEFT + 10, dangerY()); ctx.lineTo(RIGHT - 10, dangerY()); ctx.stroke();
        ctx.restore();
        ctx.textAlign = 'right'; ctx.font = '9px system-ui';
        ctx.fillStyle = overflow > 0.15 ? '#f3aa8f' : '#a2b9b0';
        ctx.fillText(overflow > 0.15 ? '即将装满' : '警戒线', RIGHT - 10, dangerY() - 8);
        if (shots === 0) {
          ctx.textAlign = 'center'; ctx.fillStyle = '#adc8bc'; ctx.font = '500 16px system-ui';
          ctx.fillText('让同值水球，碰在一起', W / 2, dangerY() + (floor - dangerY()) * 0.53);
          ctx.fillStyle = '#829f93'; ctx.font = '11px system-ui';
          ctx.fillText('2 → 4 → 8 → … → 1024', W / 2, dangerY() + (floor - dangerY()) * 0.53 + 25);
        }
      }

      /** 将压缩掉的面积补到未受挤压的位置，避免软球看起来只是被削掉一块。 */
      function surfaceRadii(ball, preview = false) {
        const radii = Float32Array.from(ball.offset, offset => ball.r + offset);
        const areaStep = Math.sin(TAU / N) / 2;
        for (let pass = 0; pass < 3; pass++) {
          let area = 0;
          for (let k = 0; k < N; k++) area += radii[k] * radii[(k + 1) % N] * areaStep;
          const compensation = clamp(Math.sqrt(Math.PI * ball.r * ball.r / Math.max(1, area)), 0.85, 1.18);
          for (let k = 0; k < N; k++) {
            const angle = k * TAU / N;
            const nx = Math.cos(angle), ny = Math.sin(angle);
            let r = clamp(radii[k] * compensation, ball.r * 0.4, ball.r * 1.55);
            for (const contact of ball.contacts) {
              const projection = nx * contact.nx + ny * contact.ny;
              if (projection > 0.01) r = Math.min(r, contact.d / projection);
            }
            // 面积补偿后再次限制接触面，鼓起的球身不能越过墙或相邻球。
            if (!preview) {
              if (nx < -0.001) r = Math.min(r, (ball.x - LEFT) / -nx);
              if (nx > 0.001) r = Math.min(r, (RIGHT - ball.x) / nx);
              if (ny > 0.001) r = Math.min(r, (bottom() - ball.y) / ny);
              if (ny < -0.001) r = Math.min(r, (ball.y - 10) / -ny);
            }
            radii[k] = r;
          }
        }
        return radii;
      }

      function drawBall(ball, preview = false) {
        const colors = palette(ball.value);
        const radii = surfaceRadii(ball, preview);
        const points = Array.from(radii, (r, k) => ({ x: ball.x + Math.cos(k * TAU / N) * r, y: ball.y + Math.sin(k * TAU / N) * r }));
        ctx.beginPath();
        const last = points[N - 1], first = points[0];
        ctx.moveTo((last.x + first.x) / 2, (last.y + first.y) / 2);
        for (let k = 0; k < N; k++) {
          const p = points[k], next = points[(k + 1) % N];
          ctx.quadraticCurveTo(p.x, p.y, (p.x + next.x) / 2, (p.y + next.y) / 2);
        }
        ctx.closePath();
        ctx.save();
        ctx.shadowColor = '#00000040'; ctx.shadowBlur = 7; ctx.shadowOffsetY = 4;
        ctx.fillStyle = colors[0]; ctx.fill();
        ctx.restore();
        ctx.fillStyle = colors[1]; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = `800 ${Math.max(12, ball.r * (ball.value >= 1024 ? 0.69 : ball.value >= 128 ? 0.81 : 0.91))}px system-ui`;
        ctx.fillText(ball.value, ball.x, ball.y + 1);
        ctx.textBaseline = 'alphabetic';
      }

      function drawLauncher(time) {
        if (ended) return;
        const start = origin();
        const power = charge();
        const currentRadius = radius(queue[0]);
        if (aiming) {
          // 使用同样的固定步长和接触弹簧；轨迹只预估重力及墙面，忽略其他水球。
          const prediction = { ...start, r: currentRadius, impactTimer: 1,
            vx: Math.sin(aimAngle) * shotSpeed(power), vy: Math.cos(aimAngle) * shotSpeed(power) };
          ctx.save();
          for (let k = 0; k < 43; k++) {
            for (let substep = 0; substep < 4; substep++) {
              prediction.vy = Math.min(1400, prediction.vy + GRAVITY * STEP);
              prediction.vx *= Math.exp(-0.2 * STEP);
              prediction.x += prediction.vx * STEP;
              prediction.y += prediction.vy * STEP;
              walls(prediction, false, true);
            }
            if (prediction.y > bottom() - currentRadius) break;
            if (k > 2 && k % 2 === 0) {
              ctx.globalAlpha = 0.65 * (1 - k / 43);
              ctx.fillStyle = '#8bd6bb'; circle(prediction.x, prediction.y, 2.7 - k * 0.035); ctx.fill();
            }
          }
          ctx.restore();
        } else {
          for (let k = 0; k < 3; k++) {
            ctx.fillStyle = `rgba(139, 214, 187, ${0.5 - k * 0.1})`;
            circle(start.x + Math.sin(aimAngle) * (currentRadius + 14 + k * 12), start.y + Math.cos(aimAngle) * (currentRadius + 14 + k * 12), 2); ctx.fill();
          }
        }
        ctx.beginPath(); ctx.arc(start.x, start.y, currentRadius + 6, 0, TAU);
        ctx.lineWidth = 2; ctx.strokeStyle = '#71b19a66'; ctx.stroke();
        if (aiming) {
          ctx.beginPath(); ctx.arc(start.x, start.y, currentRadius + 6, -Math.PI / 2, -Math.PI / 2 + Math.max(0.01, power) * TAU);
          ctx.lineWidth = 3; ctx.strokeStyle = power >= 1 ? '#edc565' : '#80d1b6'; ctx.stroke();
        }
        const preview = { value: queue[0], ...start, r: currentRadius, offset: new Float32Array(N), contacts: [] };
        if (aiming) for (let k = 0; k < N; k++) {
          preview.offset[k] = (Math.sin(k * 2 * TAU / N + time * 14) * 3.6 + Math.sin(k * 3 * TAU / N - time * 9) * 1.8) * power;
        }
        drawBall(preview, true);
      }

      function draw(time) {
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
        ctx.clearRect(0, 0, W, H);
        drawContainer(time);
        for (const ball of balls) drawBall(ball);
        for (const effect of effects) {
          const life = effect.age / effect.life;
          ctx.save(); ctx.globalAlpha = 1 - life; ctx.fillStyle = ctx.strokeStyle = effect.color;
          if (effect.type === 'ring') {
            circle(effect.x, effect.y, effect.r + life * 34); ctx.lineWidth = 2 * (1 - life); ctx.stroke();
            ctx.fillStyle = '#a7e3c9'; ctx.font = '600 13px system-ui'; ctx.textAlign = 'center';
            ctx.fillText('+' + effect.value, effect.x, effect.y - effect.r - life * 32);
          } else {
            ctx.beginPath(); ctx.ellipse(effect.x, effect.y, 2.4 * (1 - life), 4 * (1 - life), Math.atan2(effect.vy, effect.vx) - Math.PI / 2, 0, TAU); ctx.fill();
          }
          ctx.restore();
        }
        drawLauncher(time);
      }

      function frame(timestamp) {
        const dt = lastFrame ? Math.min((timestamp - lastFrame) / 1000, 0.05) : 0;
        lastFrame = timestamp;
        if (!document.hidden) {
          if (!ended) {
            accumulator += dt;
            while (accumulator >= STEP && !ended) { physics(STEP); accumulator -= STEP; }
          }
          updateEffects(dt);
          if (aiming) {
            const power = charge();
            powerFill.style.width = power * 100 + '%';
            powerText.textContent = power >= 1 ? '已蓄满 · 松手发射' : `${Math.round(power * 100)}%`;
          }
          draw(timestamp / 1000);
        }
        requestAnimationFrame(frame);
      }

      reset();
      new ResizeObserver(resize).observe(document.getElementById('field'));
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
