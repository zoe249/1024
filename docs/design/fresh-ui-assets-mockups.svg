        <rect x="0" y="28" width="48" height="48" rx="16" fill="#DFF7FF"/>
        <text x="24" y="59" text-anchor="middle" class="score" font-size="22">2</text>
        <text x="24" y="100" text-anchor="middle" class="small">Lily</text>
        <rect x="160" y="28" width="48" height="48" rx="16" fill="#FFE8D8"/>
