      <rect x="40" y="42" width="36" height="36" rx="9" fill="#14E2DE"/>
      <text x="58" y="67" text-anchor="middle" class="number" font-size="17">16</text>
      <text x="128" y="34" class="small">分数</text>
      <text x="128" y="68" class="score" font-size="27">01280</text>
