      <image href="../../assets/images/Skills/BombBtn.png" x="45" y="6" width="72" height="74"/>
      <image href="../../assets/images/Skills/HammerBtn.png" x="144" y="6" width="72" height="74"/>
      <image href="../../assets/images/Skills/V_RocketBtn.png" x="243" y="6" width="72" height="74"/>
      <image href="../../assets/images/Skills/AmountBG.png" x="91" y="44" width="30" height="30"/>
      <image href="../../assets/images/Skills/AmountBG.png" x="190" y="44" width="30" height="30"/>
      <image href="../../assets/images/Skills/AmountBG.png" x="289" y="44" width="30" height="30"/>
