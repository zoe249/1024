      <rect x="14" y="16" width="264" height="454" rx="18" fill="#AEEFF3" opacity="0.42"/>
      <g stroke="#E6FEFF" stroke-width="2" stroke-dasharray="8 7" opacity="0.88">
        <line x1="72" y1="30" x2="72" y2="456"/>
        <line x1="121" y1="30" x2="121" y2="456"/>
        <line x1="171" y1="30" x2="171" y2="456"/>
        <line x1="220" y1="30" x2="220" y2="456"/>
      </g>
      <g filter="url(#buttonShadow)">
        <rect x="27" y="391" width="42" height="42" rx="9" fill="#FF89D1"/>
        <rect x="76" y="391" width="42" height="42" rx="9" fill="#7C55FA"/>
        <rect x="125" y="391" width="42" height="42" rx="9" fill="#14E2DE"/>
        <rect x="174" y="391" width="42" height="42" rx="9" fill="#62CCFE"/>
