    <rect x="0" y="0" width="360" height="780" rx="40" fill="#1F5261" opacity="0.16"/>
    <rect x="8" y="8" width="344" height="764" rx="34" fill="#EDFFF8" filter="url(#softShadow)"/>
    <image href="../../assets/images/World/World_3_s.png" x="8" y="8" width="344" height="764" preserveAspectRatio="xMidYMid slice" clip-path="url(#phoneClipC)" opacity="0.74"/>
