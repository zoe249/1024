        <image href="../../assets/images/Buttons/LG_Blue_Btn.png" x="0" y="0" width="216" height="82" preserveAspectRatio="none"/>
        <text x="108" y="51" text-anchor="middle" class="buttonText" font-size="20">邀请好友</text>
