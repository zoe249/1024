        <rect x="174" y="342" width="42" height="42" rx="9" fill="#F87275"/>
        <rect x="125" y="158" width="42" height="42" rx="9" fill="#FFB659"/>
      </g>
      <text x="48" y="419" text-anchor="middle" class="number" font-size="18">2</text>
      <text x="97" y="419" text-anchor="middle" class="number" font-size="18">4</text>
      <text x="146" y="419" text-anchor="middle" class="number" font-size="18">16</text>
      <text x="195" y="419" text-anchor="middle" class="number" font-size="18">32</text>
      <text x="244" y="419" text-anchor="middle" class="number" font-size="18">64</text>
      <text x="97" y="370" text-anchor="middle" class="number" font-size="18">2</text>
      <text x="146" y="370" text-anchor="middle" class="number" font-size="18">16</text>
      <text x="195" y="370" text-anchor="middle" class="number" font-size="18">128</text>
      <text x="146" y="185" text-anchor="middle" class="number" font-size="16">1024</text>
