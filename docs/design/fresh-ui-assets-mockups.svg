<svg width="2200" height="1180" viewBox="0 0 2200 1180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deskBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FFF9"/>
      <stop offset="0.58" stop-color="#E6FAFF"/>
      <stop offset="1" stop-color="#FFF5D9"/>
    </linearGradient>
    <linearGradient id="glassPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#D7FAF5" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="greenBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7F66E"/>
      <stop offset="1" stop-color="#47D5A2"/>
    </linearGradient>
    <linearGradient id="blueBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#80E8FF"/>
      <stop offset="1" stop-color="#4AA8FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#4E9DAE" flood-opacity="0.24"/>
    </filter>
    <filter id="buttonShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#4E9DAE" flood-opacity="0.18"/>
    </filter>
    <pattern id="softDots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="10" r="3" fill="#A7EBD9" opacity="0.35"/>
      <circle cx="37" cy="31" r="2.5" fill="#FFC8A5" opacity="0.35"/>
    </pattern>
    <clipPath id="phoneClipA"><rect x="8" y="8" width="344" height="764" rx="34"/></clipPath>
    <clipPath id="phoneClipB"><rect x="8" y="8" width="344" height="764" rx="34"/></clipPath>
    <clipPath id="phoneClipC"><rect x="8" y="8" width="344" height="764" rx="34"/></clipPath>
    <clipPath id="phoneClipD"><rect x="8" y="8" width="344" height="764" rx="34"/></clipPath>
    <clipPath id="phoneClipE"><rect x="8" y="8" width="344" height="764" rx="34"/></clipPath>
    <style>
      .title { font: 800 34px "Eazy Chat", "Arial Rounded MT Bold", sans-serif; fill: #246272; letter-spacing: 1px; }
      .sub { font: 700 16px "Eazy Chat", "Arial Rounded MT Bold", sans-serif; fill: #6C98A0; }
      .pageTitle { font: 800 24px "Eazy Chat", "Arial Rounded MT Bold", sans-serif; fill: #2E6C79; }
      .buttonText { font: 900 24px "Eazy Chat", "Arial Rounded MT Bold", sans-serif; fill: #FFFFFF; letter-spacing: 1px; }
      .label { font: 800 18px "Eazy Chat", "Arial Rounded MT Bold", sans-serif; fill: #3F737D; }
      .small { font: 700 13px "Eazy Chat", "Arial Rounded MT Bold", sans-serif; fill: #6E9AA1; }
      .number { font: 900 24px "Courier New", monospace; fill: #FFFFFF; }
      .score { font: 900 30px "Courier New", monospace; fill: #2E6C79; }
      .assetTag { font: 600 12px "Courier New", monospace; fill: #6D9AA2; }
      .rankName { font: 800 17px "Eazy Chat", "Arial Rounded MT Bold", sans-serif; fill: #365F68; }
    </style>
  </defs>

  <rect width="2200" height="1180" fill="url(#deskBg)"/>
  <rect width="2200" height="1180" fill="url(#softDots)" opacity="0.75"/>
  <text x="70" y="70" class="title">1024 小清新 UI 设计稿 - 现有素材复用版</text>
  <text x="70" y="104" class="sub">直接引用 assets/images 下的背景、按钮、弹窗、顶部状态栏和技能资源，便于后续在 Cocos 中按图还原。</text>

  <!-- Start page with existing assets -->
  <g transform="translate(70 150)">
    <rect x="0" y="0" width="360" height="780" rx="40" fill="#1F5261" opacity="0.16"/>
    <rect x="8" y="8" width="344" height="764" rx="34" fill="#EDFFF8" filter="url(#softShadow)"/>
    <image href="../../assets/images/World/World_3_s.png" x="8" y="8" width="344" height="764" preserveAspectRatio="xMidYMid slice" clip-path="url(#phoneClipA)" opacity="0.92"/>
    <rect x="8" y="8" width="344" height="764" rx="34" fill="#EFFFF8" opacity="0.28"/>
    <rect x="36" y="72" width="288" height="172" rx="38" fill="#FFFFFF" opacity="0.82" filter="url(#buttonShadow)"/>
    <text x="180" y="142" text-anchor="middle" font-family="Courier New, monospace" font-size="54" font-weight="900" fill="#2E6C79">1024</text>
    <text x="180" y="184" text-anchor="middle" class="label">数字花园</text>
    <text x="180" y="216" text-anchor="middle" class="small">轻触开始，种出更大的数字</text>

    <g transform="translate(82 282)" filter="url(#buttonShadow)">
      <rect x="0" y="0" width="58" height="58" rx="12" fill="#FF89D1"/>
      <rect x="66" y="-18" width="58" height="58" rx="12" fill="#14E2DE"/>
      <rect x="132" y="0" width="58" height="58" rx="12" fill="#89E66C"/>
      <rect x="198" y="-18" width="58" height="58" rx="12" fill="#FFB659"/>
      <text x="29" y="39" text-anchor="middle" class="number" font-size="24">2</text>
      <text x="95" y="21" text-anchor="middle" class="number" font-size="24">16</text>
      <text x="161" y="39" text-anchor="middle" class="number" font-size="24">64</text>
      <text x="227" y="21" text-anchor="middle" class="number" font-size="20">1024</text>
    </g>

    <g transform="translate(52 406)">
      <image href="../../assets/images/Buttons/LG_Green_Btn.png" x="0" y="0" width="256" height="98" preserveAspectRatio="none" filter="url(#buttonShadow)"/>
      <text x="128" y="60" text-anchor="middle" class="buttonText">开始游戏</text>
    </g>
    <g transform="translate(72 502)">
      <image href="../../assets/images/Buttons/LG_Blue_Btn.png" x="0" y="0" width="216" height="82" preserveAspectRatio="none" filter="url(#buttonShadow)"/>
      <text x="108" y="51" text-anchor="middle" class="buttonText" font-size="20">排行榜</text>
    </g>
    <g transform="translate(86 610)">
      <image href="../../assets/images/Modal/RankBtn.png" x="0" y="0" width="56" height="58"/>
      <image href="../../assets/images/Buttons/SettingsBtn.png" x="70" y="0" width="56" height="58"/>
      <image href="../../assets/images/Modal/ShareBtn.png" x="140" y="0" width="56" height="58"/>
      <text x="28" y="78" text-anchor="middle" class="small">榜</text>
      <text x="98" y="78" text-anchor="middle" class="small">设</text>
      <text x="168" y="78" text-anchor="middle" class="small">享</text>
    </g>
    <text x="180" y="820" text-anchor="middle" class="pageTitle">开始页：World + 大按钮 + 快捷图标</text>
  </g>

  <!-- Game page with existing assets -->
  <g transform="translate(495 150)">
    <rect x="0" y="0" width="360" height="780" rx="40" fill="#1F5261" opacity="0.16"/>
    <rect x="8" y="8" width="344" height="764" rx="34" fill="#EDFFF8" filter="url(#softShadow)"/>
    <image href="../../assets/images/World/World_3_s.png" x="8" y="8" width="344" height="764" preserveAspectRatio="xMidYMid slice" clip-path="url(#phoneClipB)" opacity="0.82"/>
    <rect x="8" y="8" width="344" height="764" rx="34" fill="#EFFFF8" opacity="0.24"/>

    <g transform="translate(7 14)">
      <image href="../../assets/images/Status/TopPanel.png" x="0" y="0" width="346" height="86" preserveAspectRatio="none" opacity="0.95"/>
