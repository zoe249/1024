<svg width="2200" height="1180" viewBox="0 0 2200 1180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9FFF7"/>
      <stop offset="0.55" stop-color="#DDF8FF"/>
      <stop offset="1" stop-color="#FFF6D9"/>
    </linearGradient>
    <linearGradient id="phoneBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFFFF8"/>
      <stop offset="0.52" stop-color="#DFF7FF"/>
      <stop offset="1" stop-color="#FFF2C7"/>
    </linearGradient>
    <linearGradient id="mintCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#CFF8F2" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="greenBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7F66E"/>
      <stop offset="1" stop-color="#48D7A4"/>
    </linearGradient>
    <linearGradient id="blueBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DE7FF"/>
      <stop offset="1" stop-color="#4AA8FF"/>
    </linearGradient>
    <linearGradient id="yellowBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE684"/>
      <stop offset="1" stop-color="#FFBC58"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5CA7B8" flood-opacity="0.22"/>
    </filter>
    <filter id="tinyShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5CA7B8" flood-opacity="0.18"/>
    </filter>
    <pattern id="dotPattern" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="3" fill="#B9E8DF" opacity="0.34"/>
      <circle cx="32" cy="28" r="2" fill="#FFC9A8" opacity="0.34"/>
    </pattern>
    <style>
      .board-title { font: 800 34px "Eazy Chat", "Arial Rounded MT Bold", sans-serif; fill: #226071; letter-spacing: 1px; }
      .page-title { font: 800 24px "Eazy Chat", "Arial Rounded MT Bold", sans-serif; fill: #2E6C79; }
      .label { font: 700 18px "Eazy Chat", "Arial Rounded MT Bold", sans-serif; fill: #497984; }
      .small { font: 600 13px "Eazy Chat", "Arial Rounded MT Bold", sans-serif; fill: #6E9AA1; }
      .number { font: 900 26px "Courier New", monospace; fill: #FFFFFF; }
      .score { font: 900 30px "Courier New", monospace; fill: #2E6C79; }
      .button-text { font: 900 24px "Eazy Chat", "Arial Rounded MT Bold", sans-serif; fill: #FFFFFF; letter-spacing: 1px; }
      .rank-num { font: 900 20px "Courier New", monospace; fill: #66B69D; }
      .rank-name { font: 800 18px "Eazy Chat", "Arial Rounded MT Bold", sans-serif; fill: #365F68; }
      .hint { font: 700 15px "Eazy Chat", "Arial Rounded MT Bold", sans-serif; fill: #5C8C94; }
    </style>
  </defs>

  <rect width="2200" height="1180" fill="#F6FBF7"/>
  <rect width="2200" height="1180" fill="url(#dotPattern)" opacity="0.55"/>
  <text x="70" y="70" class="board-title">1024 小清新 UI 设计稿</text>
  <text x="70" y="104" class="hint">视觉方向：清晨薄荷花园 / 轻玻璃棋盘 / 糖果数字块 / 适配 720×1280 竖屏逻辑尺寸</text>

  <!-- Start Page -->
