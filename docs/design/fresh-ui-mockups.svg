    <rect x="8" y="8" width="344" height="764" rx="34" fill="url(#phoneBg)" filter="url(#softShadow)"/>
    <rect x="8" y="8" width="344" height="764" rx="34" fill="url(#dotPattern)" opacity="0.5"/>
    <circle cx="282" cy="92" r="56" fill="#FFF3A6" opacity="0.9"/>
